name: Compilar APK Yape Sync

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Inicializar y regenerar archivos Android de Flutter
        run: |
          cd flutter_app
          flutter create . --platforms android --org com.yape
          flutter pub get

      - name: Compilar APK (Release)
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: yape-sync-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
